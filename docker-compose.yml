services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: autonomous-research-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_analyst
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: research_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U research_user -d research_analyst" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: autonomous-research-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
